name: Build Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source
        run: unzip -o -q source.zip -d app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install and sync
        working-directory: app
        run: |
          npm ci
          npx cap sync android
      - name: Build release bundle (unsigned) and debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleDebug
      - name: Publish build as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/android/app/build/outputs/bundle/release/app-release.aab tahaddi-unsigned.aab
          cp app/android/app/build/outputs/apk/debug/app-debug.apk tahaddi-debug.apk
          gh release create "build-${{ github.run_number }}" tahaddi-unsigned.aab tahaddi-debug.apk --title "Build ${{ github.run_number }}" --notes "Automated build"
